[package]
name = "anime-downloader"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "anime-downloader"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dirs = "6"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
futures = "0.3"
once_cell = "1"
opener = "0.8"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "rustls-tls", "stream"] }
rfd = "0.15"
scraper = "0.27.0"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
