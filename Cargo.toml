[package]
name = "naruto-scraper"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "gzip"], default-features = false }
scraper = "0.20"
futures = "0.3"
url = "2"
percent-encoding = "2"
anyhow = "1"
regex = "1"
once_cell = "1"

[profile.release]
opt-level = 3
lto = "thin"
